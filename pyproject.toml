[project]
name = "safety-vision"
version = "0.1.0"
description = "Real-time worksite safety monitoring with computer vision (PPE, worker ID, zones, falls)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "requests>=2.28",
    "imagehash>=4.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real YOLO models and video files",
]

[tool.setuptools]
packages = ["src", "config"]
